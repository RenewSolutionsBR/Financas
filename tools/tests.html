<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes — Livro de Gastos</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    .ok { color: #0a7d32; }
    .falhou { color: #b3261e; font-weight: 600; }
    .erro { color: #b3261e; margin: 0 0 .5rem 1.5rem; font-family: monospace; white-space: pre-wrap; }
    #resumo { font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Testes</h1>
  <div id="resumo">rodando…</div>
  <div id="lista"></div>
  <!-- Carregado como global XLSX, do mesmo jeito que index.html fará: os
       testes de backup.browser.test.js exercitam o ciclo real de exportar/
       importar contra o SheetJS de verdade, não só contra objetos JS. -->
  <script src="../vendor/xlsx.full.min.js"></script>
  <script type="module">
    import { runAll } from '../tests/harness.js';
    import { TEST_MODULES, BROWSER_ONLY_MODULES } from '../tests/index.js';
    import { origemSeguraParaTestesDestrutivos } from '../tests/fixtures/origem-teste.js';

    // Esta suíte grava e apaga dados de verdade neste navegador: os testes
    // de navegador escrevem no banco `financas`, e alguns criam/derrubam um
    // banco `livro-de-gastos` FALSO para simular o app anterior. Como este
    // arquivo é versionado e o GitHub Pages serve a raiz do repositório, a
    // origem de produção é a MESMA origem onde o app anterior de verdade
    // guarda o banco `livro-de-gastos` real do usuário — sem esta guarda,
    // abrir esta página lá apagaria os dados dele. A checagem roda antes do
    // laço de import, então nenhum teste chega a ser sequer carregado fora
    // de localhost.
    if (!origemSeguraParaTestesDestrutivos(location.hostname)) {
      const resumo = document.getElementById('resumo');
      resumo.textContent =
        'Esta suíte de testes só roda em localhost: ela grava e apaga dados neste ' +
        'navegador, inclusive um banco que simula o app anterior. Rode o servidor ' +
        'local e abra esta página por localhost (ou 127.0.0.1) para executar os testes.';
      resumo.className = 'falhou';
      throw new Error('Suíte de testes bloqueada fora de localhost/127.0.0.1.');
    }

    for (const mod of [...TEST_MODULES, ...BROWSER_ONLY_MODULES]) {
      await import(`../tests/${mod.replace('./', '')}`);
    }

    const { total, passed, failed, results } = await runAll();
    document.getElementById('resumo').textContent =
      `${passed}/${total} passaram${failed ? `, ${failed} falharam` : ''}`;
    document.getElementById('resumo').className = failed ? 'falhou' : 'ok';

    const lista = document.getElementById('lista');
    for (const r of results) {
      const linha = document.createElement('div');
      linha.className = r.ok ? 'ok' : 'falhou';
      linha.textContent = `${r.ok ? '✓' : '✗'} ${r.suite} > ${r.teste}`;
      lista.appendChild(linha);
      if (!r.ok) {
        const erro = document.createElement('div');
        erro.className = 'erro';
        erro.textContent = r.erro;
        lista.appendChild(erro);
      }
    }
  </script>
</body>
</html>
