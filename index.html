<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- theme-color unico (sem variante escura): o app abandonou o tema
       escuro automatico em 2026-08-13 — ver o comentario no topo de
       styles.css. Com a variante dark aqui, a barra do navegador/PWA
       continuava preta em aparelho no modo escuro, emoldurando de preto
       uma tela que agora e sempre clara. -->
  <meta name="theme-color" content="#f4efe4">
  <title>Livro de Gastos</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="cabecalho">
    <h1>Livro de Gastos</h1>
    <!-- Ferramentas fica no cabecalho (nao numa aba) porque e acessivel de
         qualquer tela e nao faz parte do uso diario: backup, exportacoes,
         diagnostico e as acoes de apagar. Ver src/ui/ferramentas.js. -->
    <button type="button" id="btnFerramentas" class="btn-ferramentas" aria-haspopup="dialog">Ferramentas</button>
    <div id="statusApp" class="status" role="status" aria-live="polite"></div>
  </header>

  <nav class="tabbar" role="tablist">
    <button class="tab-btn active" data-tab="Lancamentos" role="tab" aria-selected="true">Lançamentos</button>
    <button class="tab-btn" data-tab="Conciliacao" role="tab" aria-selected="false">Conciliação</button>
    <button class="tab-btn" data-tab="Parcelas" role="tab" aria-selected="false">Parcelas</button>
    <button class="tab-btn" data-tab="Dashboard" role="tab" aria-selected="false">Dashboard</button>
    <button class="tab-btn" data-tab="Cadastros" role="tab" aria-selected="false">Cadastros</button>
  </nav>

  <main>
    <section class="tab-panel active" id="tabLancamentos" role="tabpanel"></section>
    <section class="tab-panel" id="tabConciliacao" role="tabpanel"></section>
    <section class="tab-panel" id="tabParcelas" role="tabpanel">
      <p class="vazio">A previsão de parcelas chega na Fase 2.</p>
    </section>
    <section class="tab-panel" id="tabDashboard" role="tabpanel"></section>
    <section class="tab-panel" id="tabCadastros" role="tabpanel"></section>
  </main>

  <div id="modalRaiz"></div>
  <div id="toastRaiz" aria-live="polite"></div>

  <script src="vendor/xlsx.full.min.js"></script>
  <!-- Carregador com "cache busting" por versao.

       O problema (medido 2026-08-13): o GitHub Pages manda
       `Cache-Control: max-age=600` em cada modulo. Por 10 minutos o
       navegador serve a copia VELHA sem nem perguntar ao servidor, e o
       service worker (network-first) nao ajuda, porque a requisicao nem
       chega nele. O app entao mostrava a versao nova no rodape (version.js
       buscado noutro momento) rodando codigo antigo — aconteceu em v20,
       v22 e v23, sempre custando uma investigacao inteira ate perceber.

       A solucao e um IMPORT MAP: ele reescreve o caminho de CADA modulo
       para incluir `?v=APP_VERSION`. Testado em navegador (2026-08-13):
       so a query no import inicial NAO basta — um modulo ES resolve seus
       imports relativos SEM herdar a query string do pai, entao `app.js`
       vinha novo e todo o resto vinha do cache. Com o import map, a arvore
       inteira ganha URL nova a cada publicacao.

       A lista de modulos e gerada a partir de MODULOS (abaixo), que e a
       mesma fonte usada pelo precache do service worker — ver sw.js. -->
  <script type="module">
    import { APP_VERSION } from './src/version.js';
    import { MODULOS } from './src/core/modulos.js';

    const mapa = { imports: {} };
    for (const caminho of MODULOS) {
      // Chave e valor absolutos a partir da raiz do app: o import map casa
      // pela URL JA RESOLVIDA do modulo, nao pelo texto do `import`.
      const url = new URL(caminho, document.baseURI).href;
      mapa.imports[url] = `${url}?v=${APP_VERSION}`;
    }
    const tag = document.createElement('script');
    tag.type = 'importmap';
    tag.textContent = JSON.stringify(mapa);
    // `document.currentScript` e SEMPRE null dentro de um modulo ES (so
    // funciona em script classico) — usar ele aqui quebrava o boot inteiro
    // com "Cannot read properties of null". O import map so precisa existir
    // no documento antes do primeiro import(), e appendChild garante isso.
    document.head.appendChild(tag);

    await import(`./src/app.js?v=${APP_VERSION}`);
  </script>
</body>
</html>
